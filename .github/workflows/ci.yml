name: CI

# Basic checks only (lint, type check, build) to conserve Actions minutes.
# Unit tests, coverage, ratchets, WASM/clippy and E2E run locally:
#   pnpm exec vitest run · pnpm lint:rust · pnpm exec playwright test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      # pnpm version is read from `packageManager` field in package.json —
      # specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings 0 --no-warn-ignored

      - name: Lint CSS
        run: pnpm exec stylelint "src/**/*.css" --max-warnings 0

      # build:web runs tsc -b (type check) + vite build + chunk-cycle check.
      # It skips wasm:build — WASM has JS fallbacks.
      - name: Build
        run: pnpm run build:web
